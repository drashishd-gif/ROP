# Example training configuration for ROPNet.
# Copy/edit and pass with: python -m rop.train --config config.yaml

data_dir: data
train_dir: data/train
val_dir: data/val
test_dir: data/test
checkpoint_dir: checkpoints
checkpoint_name: rop_cnn.pt

image_size: 224
batch_size: 32
epochs: 30
lr: 0.001
weight_decay: 0.0001
num_workers: 2
seed: 42
